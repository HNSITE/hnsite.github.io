<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (() => {
      const url = new URL(window.location.href);
      if (!url.searchParams.has("_fresh")) {
        url.searchParams.set("_fresh", Date.now().toString());
        window.location.replace(url.toString());
        return;
      }
      url.searchParams.delete("_fresh");
      const query = url.searchParams.toString();
      window.history.replaceState(null, "", url.pathname + (query ? `?${query}` : "") + url.hash);
    })();
  </script>
  <title>빙고방 | CHURANG</title>
  <link rel="stylesheet" href="./assets/styles.css?v=16" />
</head>
<body class="app-page bingo-room-page">
  <header class="topbar app-topbar">
    <a class="topbar-brand" href="./app.html">CHURANG</a>
    <nav class="topbar-user" aria-label="사용자 메뉴">
      <a class="topbar-link" href="./bingo.html">빙고 목록</a>
      <span id="userEmail" class="topbar-email"></span>
      <span id="roleBadge" class="badge"></span>
      <button id="logoutButton" class="secondary compact-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="page-wrap bingo-room-wrap">
    <section id="loadingPanel" class="panel">
      <h2>빙고방을 확인하고 있습니다...</h2>
    </section>

    <div id="roomContent" class="hidden">
      <section class="panel room-title-panel">
        <div class="room-title-main">
          <div>
            <p class="eyebrow">BINGO ROOM</p>
            <h1 id="roomTitle">빙고</h1>
            <p id="roomMeta" class="muted"></p>
          </div>
          <div id="roomActions" class="room-actions"></div>
        </div>
        <p id="roomMessage" class="message room-inline-message"></p>

        <div id="participantManagePanel" class="room-participant-inline hidden">
          <div class="section-title-row participant-inline-head">
            <div>
              <p class="eyebrow">OWNER</p>
              <h2>참가자 관리</h2>
            </div>
            <button id="saveParticipantsButton" type="button">변경사항 저장</button>
          </div>

          <div class="participant-manager-grid">
            <section class="participant-manager-column">
              <div class="participant-manager-heading">
                <h3>현재 참가자</h3>
                <span id="currentParticipantCount" class="access-pill">0명</span>
              </div>
              <input id="currentParticipantSearch" class="participant-manage-search" type="search" placeholder="현재 참가자 검색" autocomplete="off" />
              <div id="currentParticipantList" class="participant-manage-list"></div>
              <div id="currentParticipantPagination" class="list-pagination compact-pagination" aria-label="현재 참가자 페이지"></div>
            </section>

            <section class="participant-manager-column">
              <div class="participant-manager-heading">
                <h3>추가 가능한 사용자</h3>
                <span id="availableParticipantCount" class="access-pill">0명</span>
              </div>
              <input id="availableParticipantSearch" class="participant-manage-search" type="search" placeholder="추가 가능한 사용자 검색" autocomplete="off" />
              <div id="availableParticipantList" class="participant-manage-list"></div>
              <div id="availableParticipantPagination" class="list-pagination compact-pagination" aria-label="추가 가능한 사용자 페이지"></div>
            </section>
          </div>
        </div>
      </section>

      <section class="panel bingo-board-panel">
        <div class="section-title-row bingo-board-title-row">
          <h2>빙고판</h2>
          <span id="boardPermission" class="access-pill"></span>
        </div>
        <div class="board-scroll-wrap">
          <div id="bingoBoard" class="bingo-board" aria-label="빙고판"></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/bingo-room.js?v=16"></script>
</body>
</html>
