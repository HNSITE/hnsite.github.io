<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (() => {
      const url = new URL(window.location.href);
      if (!url.searchParams.has("_fresh")) {
        url.searchParams.set("_fresh", Date.now().toString());
        window.location.replace(url.toString());
        return;
      }
      url.searchParams.delete("_fresh");
      const query = url.searchParams.toString();
      window.history.replaceState(null, "", url.pathname + (query ? `?${query}` : "") + url.hash);
    })();
  </script>
  <title>빙고방 | CHURANG</title>
  <link rel="stylesheet" href="./assets/styles.css?v=9" />
</head>
<body class="app-page bingo-room-page">
  <header class="topbar app-topbar">
    <a class="topbar-brand" href="./app.html">CHURANG</a>
    <nav class="topbar-user" aria-label="사용자 메뉴">
      <a class="topbar-link" href="./bingo.html">빙고 목록</a>
      <span id="userEmail" class="topbar-email"></span>
      <span id="roleBadge" class="badge"></span>
      <button id="logoutButton" class="secondary compact-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="page-wrap bingo-room-wrap">
    <section id="loadingPanel" class="panel">
      <h2>빙고방을 확인하고 있습니다...</h2>
    </section>

    <div id="roomContent" class="hidden">
      <section class="panel room-title-panel">
        <div class="room-title-main">
          <div>
            <p class="eyebrow">BINGO ROOM</p>
            <h1 id="roomTitle">빙고</h1>
            <p id="roomMeta" class="muted"></p>
          </div>
          <div id="roomActions" class="room-actions"></div>
        </div>
        <p id="roomMessage" class="message"></p>
      </section>

      <section class="panel bingo-board-panel">
        <div class="section-title-row">
          <div>
            <h2>빙고판</h2>
            <p id="boardHelp" class="muted"></p>
          </div>
          <span id="boardPermission" class="access-pill"></span>
        </div>
        <div class="board-scroll-wrap">
          <div id="bingoBoard" class="bingo-board" aria-label="빙고판"></div>
        </div>
      </section>

      <section id="participantManagePanel" class="panel hidden">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">OWNER</p>
            <h2>참가자 관리</h2>
          </div>
          <button id="saveParticipantsButton" type="button">참가자 저장</button>
        </div>
        <p class="muted">참가자에서 제외하면 해당 사용자가 현재 이 방에 참가 중인 경우 자동으로 퇴장 처리됩니다.</p>
        <div id="manageParticipantList" class="participant-list"></div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/bingo-room.js?v=10"></script>
</body>
</html>
