<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHURANG 로그인</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">CHURANG</div>
    <h1>로그인</h1>
    <p class="muted">승인된 계정으로 로그인하세요.</p>

    <form id="loginForm" class="stack">
      <label>이메일<input id="email" type="email" autocomplete="username" required /></label>
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" required /></label>
      <button id="loginButton" type="submit">로그인</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </form>

    <hr />

    <section>
      <h2 class="sub-title">처음 이용하시나요?</h2>
      <button id="showRequestButton" type="button" class="secondary">사용 승인 요청</button>
    </section>

    <section id="requestPanel" class="request-panel hidden">
      <h2 class="sub-title">사용 승인 요청</h2>
      <p class="muted">승인 후 이 이메일과 비밀번호로 로그인합니다.</p>
      <form id="requestForm" class="stack">
        <label>이름<input id="requestName" type="text" maxlength="30" required /></label>
        <label>이메일<input id="requestEmail" type="email" autocomplete="email" required /></label>
        <label>비밀번호<input id="requestPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>비밀번호 확인<input id="requestPasswordConfirm" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button id="requestButton" type="submit">승인 요청 보내기</button>
        <button id="cancelRequestButton" type="button" class="secondary">취소</button>
        <p id="requestMessage" class="message" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
