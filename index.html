<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>HNSITE 로그인</title>

  <link
    rel="stylesheet"
    href="./assets/styles.css?v=28"
  />
</head>

<body class="login-page">

  <div
    class="login-deco deco-one"
    aria-hidden="true"
  ></div>

  <div
    class="login-deco deco-two"
    aria-hidden="true"
  ></div>

  <main class="login-card cute-login-card">

    <div
      class="login-illustration"
      aria-hidden="true"
    >
      ✦
    </div>

    <div class="brand">
      HNSITE
    </div>

    <h1>
      반가워요!
    </h1>

    <p class="muted login-description">
      Google 계정으로 로그인하면
      채널 선택 화면으로 이동합니다.
    </p>

    <button
      id="googleLoginButton"
      type="button"
      class="google-button"
    >

      <span
        class="google-mark"
        aria-hidden="true"
      >
        G
      </span>

      <span>
        Google 계정으로 로그인
      </span>

    </button>

    <p
      id="loginMessage"
      class="message login-message"
      aria-live="polite"
    ></p>

    <div class="login-divider">
      <span>
        채널 이용 안내
      </span>
    </div>

    <p class="muted request-help">
      HNSITE 로그인에는 별도의 사용자 승인이 없습니다.
      채널 사용 권한은 각 채널에서 승인받습니다.
    </p>

  </main>

  <script
    type="module"
    src="./js/login.js?v=29"
  ></script>

</body>
</html>
