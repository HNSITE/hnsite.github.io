<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#7d65ce"
  />

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  />

  <title>HNSITE 로그인</title>

  <link
    rel="stylesheet"
    href="./assets/styles.css?v=33"
  />
</head>

<body class="login-page">

  <div
    class="login-deco deco-one"
    aria-hidden="true"
  ></div>

  <div
    class="login-deco deco-two"
    aria-hidden="true"
  ></div>


  <main class="login-card cute-login-card">

    <div
      class="login-illustration"
      aria-hidden="true"
    >
      ✦
    </div>


    <div class="brand">
      HNSITE
    </div>


    <h1>
      반가워요!
    </h1>


    <p class="muted login-description">
      Google 계정으로 로그인하고
      사용할 채널을 선택하세요.
    </p>


    <button
      id="googleLoginButton"
      type="button"
      class="google-button"
    >

      <span
        class="google-mark"
        aria-hidden="true"
      >
        G
      </span>

      <span>
        Google 계정으로 로그인
      </span>

    </button>


    <p
      id="loginMessage"
      class="message login-message"
      aria-live="polite"
    ></p>


    <div class="login-divider">
      <span>
        HNSITE
      </span>
    </div>


    <p class="muted request-help">
      채널 이용 권한은 각 채널의
      소유자 또는 관리자가 승인합니다.
    </p>

  </main>


  <script
    type="module"
    src="./js/login.js?v=33"
  ></script>

</body>
</html>
