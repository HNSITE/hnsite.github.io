<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHURANG 로그인</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body class="login-page">
  <div class="login-deco deco-one" aria-hidden="true"></div>
  <div class="login-deco deco-two" aria-hidden="true"></div>

  <main class="login-card cute-login-card">
    <div class="login-illustration" aria-hidden="true">✦</div>
    <div class="brand">CHURANG</div>
    <h1>반가워요!</h1>
    <p class="muted login-description">승인된 Google 계정으로 간편하게 접속하세요.</p>

    <button id="googleLoginButton" type="button" class="google-button">
      <span class="google-mark" aria-hidden="true">G</span>
      <span>Google 계정으로 로그인</span>
    </button>
    <p id="loginMessage" class="message login-message" aria-live="polite"></p>

    <div class="login-divider"><span>처음 이용하시나요?</span></div>
    <p class="muted request-help">Google 계정으로 로그인한 뒤 관리자에게 사용 승인을 요청할 수 있어요.</p>

    <section id="requestPanel" class="request-panel cute-request-panel hidden">
      <div class="request-icon" aria-hidden="true">♡</div>
      <h2 class="sub-title">사용 승인 요청</h2>
      <p class="muted">아래 Google 계정으로 승인 요청을 보냅니다.</p>
      <form id="requestForm" class="stack">
        <label>이름<input id="requestName" type="text" maxlength="30" required /></label>
        <label>Google 계정<input id="requestEmail" type="email" readonly /></label>
        <button id="requestButton" type="submit">승인 요청 보내기</button>
        <button id="cancelRequestButton" type="button" class="secondary">다른 계정 사용</button>
        <p id="requestMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <details class="admin-login-box">
      <summary>최고관리자 비밀번호 로그인</summary>
      <p class="muted">최초 생성한 최고관리자 계정은 이 메뉴로 로그인할 수 있습니다.</p>
      <form id="passwordLoginForm" class="stack compact-stack">
        <label>이메일<input id="adminEmail" type="email" autocomplete="username" required /></label>
        <label>비밀번호<input id="adminPassword" type="password" autocomplete="current-password" required /></label>
        <button id="passwordLoginButton" type="submit" class="secondary strong-secondary">비밀번호로 로그인</button>
      </form>
    </details>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
