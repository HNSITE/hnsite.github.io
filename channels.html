<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#7d65ce"
  />

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  />

  <title>채널 선택 | HNSITE</title>

  <link
    rel="stylesheet"
    href="./assets/styles.css"
  />
</head>

<body class="app-page">

  <header class="topbar app-topbar">

    <a
      class="topbar-brand"
      href="./channels.html"
    >
      HNSITE
    </a>

    <nav
      class="topbar-user"
      aria-label="사용자 메뉴"
    >

      <button
        id="openCreateChannelButton"
        class="channel-create-top-button hidden"
        type="button"
      >
        <span class="channel-create-plus">＋</span>
        <span>채널 생성</span>
      </button>


      <button
        id="openChannelRequestsButton"
        class="channel-request-admin-button hidden"
        type="button"
      >
        채널 신청

        <span
          id="channelRequestBadge"
          class="channel-request-badge hidden"
        >
          0
        </span>
      </button>


      <span
        id="userEmail"
        class="topbar-email"
      ></span>


      <span
        id="platformRoleBadge"
        class="badge"
      ></span>


      <button
        id="logoutButton"
        class="secondary compact-button"
        type="button"
      >
        로그아웃
      </button>

    </nav>

  </header>


  <main class="page-wrap channel-page-wrap">

    <section
      id="loadingPanel"
      class="panel loading-card"
    >
      <h2>
        채널 정보를 확인하고 있습니다...
      </h2>
    </section>


    <div
      id="channelContent"
      class="hidden"
    >

      <section class="channel-hero">

        <p class="eyebrow">
          HNSITE CHANNEL
        </p>

        <h1>
          사용할 채널을 선택하세요
        </h1>

      </section>


      <!-- =====================================
           내가 소유한 채널
      ====================================== -->

      <section
        id="ownedChannelSection"
        class="channel-section hidden"
      >

        <div class="channel-section-head">

          <div>
            <p class="eyebrow">
              MY CHANNEL
            </p>

            <h2>
              내 채널
            </h2>
          </div>


          <span
            id="ownedChannelCount"
            class="channel-count-badge"
          ></span>

        </div>


        <div
          id="ownedChannelList"
          class="channel-grid"
        ></div>

      </section>


      <!-- =====================================
           가입한 채널
      ====================================== -->

      <section
        id="joinedChannelSection"
        class="channel-section hidden"
      >

        <div class="channel-section-head">

          <div>
            <p class="eyebrow">
              MEMBERSHIP
            </p>

            <h2>
              가입한 채널
            </h2>
          </div>


          <span
            id="joinedChannelCount"
            class="channel-count-badge"
          ></span>

        </div>


        <div
          id="joinedChannelList"
          class="channel-grid"
        ></div>


        <div
          id="joinedChannelPagination"
          class="channel-pagination hidden"
        >

          <span
            id="joinedChannelPageSummary"
            class="channel-page-summary"
          ></span>


          <div class="channel-page-buttons">

            <button
              id="joinedChannelPrev"
              class="secondary"
              type="button"
            >
              이전
            </button>


            <span
              id="joinedChannelPageNumber"
              class="channel-page-number"
            ></span>


            <button
              id="joinedChannelNext"
              class="secondary"
              type="button"
            >
              다음
            </button>

          </div>

        </div>

      </section>


      <!-- =====================================
           전체 채널 찾기
      ====================================== -->

      <section class="channel-section channel-find-section">

        <div class="channel-section-head">

          <div>

            <p class="eyebrow">
              FIND CHANNEL
            </p>

            <h2 id="channelFindTitle">
              채널 찾기
            </h2>

          </div>

        </div>


        <div class="channel-toolbar">

          <div class="channel-search-wrap">

            <input
              id="channelSearch"
              class="channel-search-input"
              type="search"
              placeholder="채널 이름 검색"
              autocomplete="off"
              aria-label="채널 검색"
            />

          </div>


          <button
            id="requestChannelCreationButton"
            class="channel-request-button hidden"
            type="button"
          >
            채널 생성 신청하기
          </button>

        </div>


        <p
          id="channelMessage"
          class="message"
        ></p>


        <div
          id="channelList"
          class="channel-grid"
        ></div>


        <div
          id="channelPagination"
          class="channel-pagination hidden"
        >

          <span
            id="channelPageSummary"
            class="channel-page-summary"
          ></span>


          <div class="channel-page-buttons">

            <button
              id="channelPrevButton"
              class="secondary"
              type="button"
            >
              이전
            </button>


            <span
              id="channelPageNumber"
              class="channel-page-number"
            ></span>


            <button
              id="channelNextButton"
              class="secondary"
              type="button"
            >
              다음
            </button>

          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================
       개발자 새 채널 생성
  ====================================== -->

  <div
    id="createChannelModal"
    class="admin-modal hidden"
  >

    <div
      class="admin-modal-backdrop"
      data-close-create-channel
    ></div>


    <section
      class="admin-modal-dialog channel-create-modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="createChannelModalTitle"
    >

      <div class="admin-modal-header">

        <div>

          <p class="eyebrow">
            DEVELOPER
          </p>

          <h2 id="createChannelModalTitle">
            새 채널 생성
          </h2>

          <p class="muted">
            채널 이름과 소유자를 지정합니다.
          </p>

        </div>


        <button
          class="modal-close-button"
          data-close-create-channel
          type="button"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <form
        id="createChannelForm"
        class="channel-create-modal-form"
      >

        <label>

          채널 이름

          <input
            id="channelName"
            type="text"
            maxlength="40"
            placeholder="예: 훈냥"
            required
          />

        </label>


        <div class="channel-owner-field">

          <label for="channelOwnerSearch">
            채널 소유자 검색
          </label>


          <input
            id="channelOwnerSearch"
            type="search"
            placeholder="이름 또는 이메일 검색"
            autocomplete="off"
          />


          <label for="channelOwner">
            채널 소유자
          </label>


          <select
            id="channelOwner"
            required
          ></select>


          <small
            id="channelOwnerSearchResult"
            class="muted"
          ></small>

        </div>


        <fieldset class="channel-feature-fieldset">
          <legend>사용 기능</legend>

          <div class="channel-feature-options">
            <label class="channel-feature-option">
              <input
                id="channelFeatureBingo"
                type="checkbox"
                checked
              />
              <span>빙고</span>
            </label>

            <label class="channel-feature-option">
              <input
                id="channelFeatureKill"
                type="checkbox"
              />
              <span>킬내기</span>
            </label>
          </div>

          <small class="muted">
            하나 이상 선택해야 하며 두 기능 모두 선택할 수 있습니다.
          </small>
        </fieldset>


        <p
          id="createChannelMessage"
          class="message"
        ></p>


        <div class="channel-modal-actions">

          <button
            class="secondary"
            data-close-create-channel
            type="button"
          >
            취소
          </button>


          <button
            id="createChannelButton"
            type="submit"
          >
            채널 생성
          </button>

        </div>

      </form>

    </section>

  </div>


  <!-- =====================================
       개발자 채널 생성 신청
  ====================================== -->

  <div
    id="channelRequestsModal"
    class="admin-modal hidden"
  >

    <div
      class="admin-modal-backdrop"
      data-close-channel-requests
    ></div>


    <section
      class="admin-modal-dialog channel-request-modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="channelRequestsTitle"
    >

      <div class="admin-modal-header">

        <div>

          <p class="eyebrow">
            CHANNEL REQUEST
          </p>

          <h2 id="channelRequestsTitle">
            채널 생성 신청
          </h2>
        </div>


        <button
          class="modal-close-button"
          data-close-channel-requests
          type="button"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <p
        id="channelRequestsMessage"
        class="message admin-modal-message"
      ></p>


      <div
        id="channelRequestsList"
        class="channel-request-list"
      ></div>


      <div
        id="channelRequestsPagination"
        class="channel-pagination channel-request-pagination hidden"
      >

        <span
          id="channelRequestsPageSummary"
          class="channel-page-summary"
        ></span>


        <div class="channel-page-buttons">

          <button
            id="channelRequestsPrev"
            class="secondary"
            type="button"
          >
            이전
          </button>


          <span
            id="channelRequestsPageNumber"
            class="channel-page-number"
          ></span>


          <button
            id="channelRequestsNext"
            class="secondary"
            type="button"
          >
            다음
          </button>

        </div>

      </div>

    </section>

  </div>


  <script
    type="module"
    src="./js/channels.js"
  ></script>

  <script
    type="module"
    src="./js/update-modal.js"
  ></script>

  <script
    type="module"
    src="./js/network-status.js"
  ></script>

  <script
    type="module"
    src="./js/pwa.js"
  ></script>

</body>
</html>
