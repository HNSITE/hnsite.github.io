<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#7d65ce"
  />

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  />

  <title>채널 선택 | HNSITE</title>

  <link
    rel="stylesheet"
    href="./assets/styles.css?v=29"
  />
</head>

<body class="app-page">

  <header class="topbar app-topbar">

    <a
      class="topbar-brand"
      href="./channels.html"
    >
      HNSITE
    </a>

    <nav
      class="topbar-user"
      aria-label="사용자 메뉴"
    >

<button
  id="openCreateChannelButton"
  class="channel-create-top-button hidden"
  type="button"
>
  <span class="channel-create-plus">＋</span>
  <span>채널 생성</span>
</button>
<button
  id="openChannelRequestsButton"
  class="channel-request-admin-button hidden"
  type="button"
>
  채널 신청
  <span
    id="channelRequestBadge"
    class="channel-request-badge hidden"
  >
    0
  </span>
</button>
      <span
        id="userEmail"
        class="topbar-email"
      ></span>

      <span
        id="platformRoleBadge"
        class="badge"
      ></span>

      <button
        id="logoutButton"
        class="secondary compact-button"
        type="button"
      >
        로그아웃
      </button>

    </nav>

  </header>


  <main class="page-wrap channel-page-wrap">

    <section
      id="loadingPanel"
      class="panel loading-card"
    >
      <h2>
        채널 정보를 확인하고 있습니다...
      </h2>
    </section>


    <div
      id="channelContent"
      class="hidden"
    >

      <section class="channel-hero">

        <div>

          <p class="eyebrow">
            HNSITE CHANNEL
          </p>

          <h1>
            사용할 채널을 선택하세요
          </h1>
        </div>

      </section>

<div class="channel-toolbar">

  <div class="channel-search-wrap">
    <input
      id="channelSearch"
      class="channel-search-input"
      type="search"
      placeholder="채널 이름 검색"
      autocomplete="off"
      aria-label="채널 검색"
    />
  </div>

  <button
    id="requestChannelCreationButton"
    class="channel-request-button hidden"
    type="button"
  >
    채널 생성 신청하기
  </button>

</div>

<p id="channelMessage" class="message"></p>
<section id="channelList" class="channel-grid"></section>
      <p
        id="channelMessage"
        class="message"
      ></p>


      <section
        id="channelList"
        class="channel-grid"
      ></section>

    </div>

  </main>


  <!-- ================================
       개발자 채널 생성 팝업
  ================================= -->

  <div
    id="createChannelModal"
    class="admin-modal hidden"
  >

    <div
      class="admin-modal-backdrop"
      data-close-create-channel
    ></div>


    <section
      class="admin-modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="createChannelModalTitle"
      style="width:min(620px,100%)"
    >

      <div class="admin-modal-header">

        <div>

          <p class="eyebrow">
            DEVELOPER
          </p>

          <h2 id="createChannelModalTitle">
            새 채널 생성
          </h2>

          <p class="muted">
            채널 이름과 소유자를 지정합니다.
          </p>

        </div>


        <button
          class="modal-close-button"
          data-close-create-channel
          type="button"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <form
        id="createChannelForm"
        class="stack"
        style="padding:24px"
      >

        <label>
          채널 이름

          <input
            id="channelName"
            type="text"
            maxlength="40"
            placeholder="예: 추랑"
            required
          />
        </label>


        <label>
          채널 소유자

          <select
            id="channelOwner"
            required
          ></select>

        </label>


        <p
          id="createChannelMessage"
          class="message"
        ></p>


        <div
          style="
            display:flex;
            justify-content:flex-end;
            gap:10px;
          "
        >

          <button
            class="secondary"
            data-close-create-channel
            type="button"
          >
            취소
          </button>

          <button
            id="createChannelButton"
            type="submit"
          >
            채널 생성
          </button>

        </div>

      </form>

    </section>

  </div>

<div
  id="channelRequestsModal"
  class="admin-modal hidden"
>
  <div
    class="admin-modal-backdrop"
    data-close-channel-requests
  ></div>

  <section
    class="admin-modal-dialog channel-request-modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="channelRequestsTitle"
  >
    <div class="admin-modal-header">
      <div>
        <p class="eyebrow">CHANNEL REQUEST</p>
        <h2 id="channelRequestsTitle">
          채널 생성 신청
        </h2>
        <p class="muted">
          채널 생성을 요청한 사용자를 확인합니다.
        </p>
      </div>

      <button
        class="modal-close-button"
        data-close-channel-requests
        type="button"
        aria-label="닫기"
      >
        ×
      </button>
    </div>

    <p
      id="channelRequestsMessage"
      class="message admin-modal-message"
    ></p>

    <div
      id="channelRequestsList"
      class="channel-request-list"
    ></div>
  </section>
</div>
  <script
    type="module"
    src="./js/channels.js?v=29"
  ></script>

  <script
    type="module"
    src="./js/update-modal.js?v=29"
  ></script>

  <script
    type="module"
    src="./js/network-status.js?v=29"
  ></script>

  <script
    type="module"
    src="./js/pwa.js?v=29"
  ></script>

</body>

</html>
