<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사용자 관리 | CHURANG</title>
  <link rel="stylesheet" href="./assets/styles.css?v=4" />
</head>
<body class="app-page">
  <header class="topbar app-topbar">
    <a class="topbar-brand" href="./app.html">CHURANG</a>
    <nav class="topbar-user" aria-label="사용자 메뉴">
      <a class="topbar-link active" href="./users.html">사용자 관리</a>
      <a class="topbar-link" href="./app.html">메인</a>
      <span id="userEmail" class="topbar-email"></span>
      <span id="roleBadge" class="badge"></span>
      <button id="logoutButton" class="secondary compact-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="page-wrap management-wrap">
    <section id="loadingPanel" class="panel">
      <h2>관리자 권한을 확인하고 있습니다...</h2>
    </section>

    <section id="managementContent" class="panel hidden">
      <div class="section-title-row">
        <div>
          <p class="eyebrow">ADMIN</p>
          <h1>사용자 관리</h1>
          <p class="muted">승인 요청과 빙고·킬내기 권한을 관리합니다.</p>
        </div>
        <button id="refreshUsers" class="secondary" type="button">새로고침</button>
      </div>

      <p id="adminMessage" class="message"></p>

      <div class="table-wrap user-table-wrap">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>이메일</th>
              <th>구분</th>
              <th>상태</th>
              <th>빙고</th>
              <th>킬내기</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="./js/users.js?v=4"></script>
</body>
</html>
