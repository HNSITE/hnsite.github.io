<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHURANG</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <strong>CHURANG</strong>
    <div class="topbar-user"><span id="userEmail"></span><span id="roleBadge" class="badge"></span><button id="logoutButton" class="secondary">로그아웃</button></div>
  </header>

  <main class="page-wrap">
    <section id="loadingPanel" class="panel"><h2>사용자 정보를 확인하고 있습니다...</h2></section>

    <div id="appContent" class="hidden">
      <section class="panel">
        <h1>메인 화면</h1>
        <p id="welcomeText"></p>
        <div class="card-grid">
          <article class="feature-card">
            <h2>100×100 빙고판</h2>
            <p id="bingoAccess" class="access-text"></p>
            <p class="muted">빙고판 화면은 다음 단계에서 연결합니다.</p>
          </article>
          <article class="feature-card">
            <h2>킬내기 시트</h2>
            <p id="killAccess" class="access-text"></p>
            <p class="muted">킬내기 시트 화면은 다음 단계에서 연결합니다.</p>
          </article>
        </div>
      </section>

      <section id="adminPanel" class="panel hidden">
        <div class="section-title-row">
          <div><h2>사용자 관리</h2><p class="muted">승인 요청과 일반사용자 권한을 관리합니다.</p></div>
          <button id="refreshUsers" class="secondary">새로고침</button>
        </div>
        <p id="adminMessage" class="message"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>이름</th><th>이메일</th><th>구분</th><th>상태</th><th>빙고</th><th>킬내기</th><th>관리</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
