<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (() => {
      const url = new URL(window.location.href);
      if (!url.searchParams.has("_fresh")) {
        url.searchParams.set("_fresh", Date.now().toString());
        window.location.replace(url.toString());
        return;
      }
      url.searchParams.delete("_fresh");
      const query = url.searchParams.toString();
      window.history.replaceState(null, "", url.pathname + (query ? `?${query}` : "") + url.hash);
    })();
  </script>
  <title>CHURANG</title>
  <link rel="stylesheet" href="./assets/styles.css?v=22" />
</head>
<body class="app-page">
  <header class="topbar app-topbar">
    <a class="topbar-brand" href="./app.html">CHURANG</a>
    <nav class="topbar-user" aria-label="사용자 메뉴">
      <span id="userEmail" class="topbar-email"></span>
      <span id="roleBadge" class="badge"></span>
      <button id="logoutButton" class="secondary compact-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="main-menu-wrap">
    <section id="loadingPanel" class="panel loading-card">
      <h2>사용자 정보를 확인하고 있습니다...</h2>
    </section>

    <section id="appContent" class="main-menu hidden">
      <div class="menu-heading">
        <p id="welcomeText" class="menu-welcome"></p>
        <h1>무엇을 할까요?</h1>
      </div>

      <div class="service-grid">
        <article id="bingoCard" class="service-card bingo-card">
          <div class="service-icon" aria-hidden="true">✓</div>
          <h2>빙고</h2>
          <p id="bingoAccess" class="service-access"></p>
          <a id="bingoButton" class="service-button" href="./bingo.html">들어가기</a>
        </article>

        <article id="killCard" class="service-card kill-card">
          <div class="service-icon" aria-hidden="true">✎</div>
          <h2>킬내기</h2>
          <p id="killAccess" class="service-access"></p>
          <a id="killButton" class="service-button" href="#">들어가기</a>
        </article>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js?v=17"></script>
  <script type="module" src="./js/update-modal.js?v=22"></script>
</body>
</html>
